<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#2d4a3e"/>
  <meta name="description" content="Vegetarisch-Ketogener Ernährungsplan für zwei Personen"/>
  <link rel="manifest" href="manifest.json"/>
  <title>VegeKeto – Dein Plan</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --green-dark:#1a3028;--green-mid:#2d4a3e;--green:#3d6b58;--green-light:#5a8f77;
      --cream:#f5f0e8;--cream2:#ede8dc;--cream3:#e0d9cc;
      --amber:#c8853a;--amber-light:#e8a85a;--red:#c04444;--blue:#3a6b8a;
      --text:#1a2420;--text2:#3d5048;--text3:#6b7d74;
      --radius:12px;--radius-lg:18px;
    }
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden}
    h1,h2,h3,h4{font-family:'DM Serif Display',serif}
    .app-header{background:var(--green-dark);color:var(--cream);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.3)}
    .app-header h1{font-size:1.4rem;font-weight:400;letter-spacing:0.02em;color:var(--cream)}
    .logo-dot{width:8px;height:8px;background:var(--amber-light);border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
    nav{display:flex;gap:4px}
    nav button{background:none;border:none;color:rgba(245,240,232,0.6);padding:8px 12px;cursor:pointer;border-radius:8px;font-size:0.8rem;font-family:'DM Sans',sans-serif;font-weight:500;letter-spacing:0.03em;transition:all 0.2s;white-space:nowrap}
    nav button.active,nav button:hover{color:var(--cream);background:rgba(245,240,232,0.12)}
    .main{max-width:1200px;margin:0 auto;padding:1.5rem}
    .card{background:white;border-radius:var(--radius-lg);padding:1.5rem;border:1px solid var(--cream3);margin-bottom:1rem}
    .card-sm{background:white;border-radius:var(--radius);padding:1rem;border:1px solid var(--cream3)}
    .btn{border:none;border-radius:8px;padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:500;cursor:pointer;transition:all 0.2s}
    .btn-primary{background:var(--green);color:white}.btn-primary:hover{background:var(--green-light)}
    .btn-secondary{background:var(--cream2);color:var(--text)}.btn-secondary:hover{background:var(--cream3)}
    .btn-amber{background:var(--amber);color:white}.btn-amber:hover{background:var(--amber-light)}
    .btn-sm{padding:5px 12px;font-size:0.78rem}
    .btn-danger{background:#fef2f2;color:var(--red);border:1px solid #fecaca}.btn-danger:hover{background:#fee2e2}
    .progress-bar{height:10px;background:var(--cream2);border-radius:5px;overflow:hidden;margin:4px 0}
    .progress-fill{height:100%;border-radius:5px;transition:width 0.5s ease}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:0.72rem;font-weight:500}
    .badge-green{background:#d1fae5;color:#065f46}
    .badge-amber{background:#fef3c7;color:#92400e}
    .badge-red{background:#fee2e2;color:#991b1b}
    .badge-blue{background:#dbeafe;color:#1e40af}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
    .grid-7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    input,select,textarea{font-family:'DM Sans',sans-serif;border:1px solid var(--cream3);border-radius:8px;padding:8px 12px;font-size:0.9rem;width:100%;background:white;color:var(--text);outline:none;transition:border-color 0.2s}
    input:focus,select:focus,textarea:focus{border-color:var(--green-light)}
    label{font-size:0.82rem;font-weight:500;color:var(--text2);display:block;margin-bottom:4px}
    .form-group{margin-bottom:1rem}
    .tag{display:inline-flex;align-items:center;background:var(--cream2);border-radius:6px;padding:3px 8px;font-size:0.76rem;color:var(--text2);margin:2px}
    .meal-card{border:1.5px solid var(--cream3);border-radius:var(--radius);padding:0.8rem;cursor:pointer;transition:all 0.2s;background:white;position:relative}
    .meal-card:hover{border-color:var(--green-light);box-shadow:0 2px 12px rgba(45,74,62,0.1)}
    .meal-card.eaten{border-color:#10b981;background:#f0fdf4}
    .meal-card.eaten::after{content:'✓';position:absolute;top:6px;right:8px;color:#10b981;font-size:1rem;font-weight:600}
    .week-day{text-align:center}
    .day-header{background:var(--green-dark);color:var(--cream);padding:6px 4px;border-radius:var(--radius) var(--radius) 0 0;font-size:0.75rem;font-weight:500;text-align:center}
    .day-col{border-radius:var(--radius);overflow:hidden;border:1px solid var(--cream3)}
    .check-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--cream3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
    .check-box.checked{background:var(--green);border-color:var(--green)}
    .check-box.checked::after{content:'✓';color:white;font-size:0.8rem;font-weight:700}
    .warning-card{border-left:4px solid var(--amber);background:#fffbeb;border-radius:0 var(--radius) var(--radius) 0;padding:0.8rem;margin-bottom:0.5rem}
    .danger-card{border-left:4px solid var(--red);background:#fef2f2;border-radius:0 var(--radius) var(--radius) 0;padding:0.8rem;margin-bottom:0.5rem}
    .info-card{border-left:4px solid var(--blue);background:#eff6ff;border-radius:0 var(--radius) var(--radius) 0;padding:0.8rem;margin-bottom:0.5rem}
    .tabs{display:flex;gap:2px;background:var(--cream2);border-radius:10px;padding:3px;margin-bottom:1rem}
    .tab{flex:1;text-align:center;padding:7px;border-radius:8px;cursor:pointer;font-size:0.82rem;font-weight:500;color:var(--text3);transition:all 0.2s;border:none;background:none;font-family:'DM Sans',sans-serif}
    .tab.active{background:white;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.1)}
    .drag-handle{cursor:grab;color:var(--text3);padding:2px 4px;font-size:0.8rem}
    .drag-handle:active{cursor:grabbing}
    .shopping-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--cream2)}
    .shopping-item:last-child{border-bottom:none}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
    .modal{background:white;border-radius:var(--radius-lg);padding:1.5rem;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
    .snack{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--green-dark);color:var(--cream);padding:10px 18px;border-radius:10px;font-size:0.85rem;z-index:300;animation:slideIn 0.3s ease;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
    @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .macro-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .macro-label{font-size:0.78rem;color:var(--text3);width:60px;flex-shrink:0}
    .macro-value{font-size:0.78rem;font-weight:500;color:var(--text2);width:80px;text-align:right;flex-shrink:0}
    @media(max-width:768px){.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr 1fr}.grid-7{grid-template-columns:repeat(3,1fr)}.main{padding:1rem}nav button span{display:none}}
    .week-nav{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
    .week-nav button{background:white;border:1px solid var(--cream3);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
    .week-nav button:hover{border-color:var(--green-light)}
    .week-nav span{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--text)}
    .electrolyte-btn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:all 0.2s;border:1.5px solid var(--cream3);background:white}
    .electrolyte-btn.done{border-color:#10b981;background:#f0fdf4}
    .leftover-card{background:#fffbf0;border:1.5px dashed var(--amber);border-radius:var(--radius);padding:1rem;margin-bottom:0.5rem}
    .recipe-macro{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:0.75rem;font-weight:600}
    .rm-carb{background:#dbeafe;color:#1e40af}
    .rm-prot{background:#d1fae5;color:#065f46}
    .rm-fat{background:#fef3c7;color:#92400e}
    .rm-cal{background:#f3e8ff;color:#6b21a8}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const {useState,useEffect,useCallback,useRef,useMemo}=React;

  // ─── DATA ────────────────────────────────────────────────────────────────
  const PERSONS={
    A:{name:"Person A",gender:"m",height:190,weight:85,age:35,icon:"♂",color:"#3d6b58"},
    B:{name:"Person B",gender:"f",height:170,weight:60,age:30,icon:"♀",color:"#c8853a"}
  };

  function calcMacros(p){
    const bmr=p.gender==="m"?88.36+13.4*p.weight+4.8*p.height-5.7*p.age:447.6+9.2*p.weight+3.1*p.height-4.3*p.age;
    const tdee=Math.round(bmr*1.4);
    const protein=Math.round(p.weight*1.4);
    const carbs=25;
    const fat=Math.round((tdee-protein*4-carbs*4)/9);
    return{kcal:tdee,protein,carbs,fat};
  }

  const RECIPES=[
    {id:"r1",name:"Avocado-Eier-Bowl",type:"breakfast",prepMin:8,
      macros:{kcal:380,carbs:6,protein:18,fat:30},
      ingredients:["2 Eier","1 Avocado","20g Feta","Salz, Pfeffer","1 EL Olivenöl"],
      steps:"Eier spiegeln. Avocado würfeln. Alles in einer Bowl anrichten, Feta drüber.",
      tags:["schnell","B12","Ω3"],batchDays:1},
    {id:"r2",name:"Blumenkohl-Käse-Omelette",type:"breakfast",prepMin:10,
      macros:{kcal:340,carbs:7,protein:22,fat:24},
      ingredients:["3 Eier","50g Blumenkohl (geraspelt)","30g Cheddar","1 EL Butter","Kräuter"],
      steps:"Eier verquirlen, Blumenkohl unterheben, in Butter braten, Käse schmelzen lassen.",
      tags:["schnell","low-carb"],batchDays:1},
    {id:"r3",name:"Griechisches Omelett mit Spinat",type:"breakfast",prepMin:8,
      macros:{kcal:360,carbs:5,protein:24,fat:26},
      ingredients:["3 Eier","40g Babyspinat","20g Kalamata-Oliven","20g Feta","Oregano"],
      steps:"Eier schlagen, Spinat kurz andünsten, alles zusammen stocken lassen, Feta drüber.",
      tags:["schnell","Eisen"],batchDays:1},
    {id:"r4",name:"Keto-Müsli (Abends vorbereiten)",type:"breakfast",prepMin:5,
      macros:{kcal:310,carbs:8,protein:12,fat:26},
      ingredients:["40g Kokosraspeln","30g Walnüsse","1 EL Chiasamen","150ml Kokosmilch","Zimtpulver"],
      steps:"Alles abends mischen, im Kühlschrank quellen lassen. Morgens fertig.",
      tags:["prep","Ω3"],batchDays:3},
    {id:"r5",name:"Zucchini-Halloumi-Pfanne",type:"lunch",prepMin:20,
      macros:{kcal:480,carbs:10,protein:28,fat:36},
      ingredients:["200g Halloumi","2 Zucchini","1 Paprika","2 EL Olivenöl","Knoblauch","Rosmarin"],
      steps:"Halloumi anbraten. Gemüse dazu, al dente garen. Mit Rosmarin & Knoblauch würzen.",
      tags:["batch"],batchDays:2},
    {id:"r6",name:"Gerösteter Blumenkohl mit Tahini",type:"lunch",prepMin:30,
      macros:{kcal:420,carbs:14,protein:16,fat:32},
      ingredients:["1 Blumenkohl","3 EL Olivenöl","2 EL Tahini","1 Zitrone","Petersilie","Paprikapulver"],
      steps:"Blumenkohl in Röschen, mit Öl & Paprika rösten (200°C, 25 Min). Mit Tahini-Soße servieren.",
      tags:["batch","vegan"],batchDays:3},
    {id:"r7",name:"Keto Buddha Bowl",type:"lunch",prepMin:20,
      macros:{kcal:510,carbs:12,protein:22,fat:40},
      ingredients:["150g Tempeh","1 Avocado","80g Edamame","Rucola","2 EL Tahini","Sesam"],
      steps:"Tempeh anbraten. Bowl mit Rucola, Edamame, Avocado anrichten. Tahini-Dressing darüber.",
      tags:["protein","vegan"],batchDays:1},
    {id:"r8",name:"Pilz-Käse-Suppe",type:"lunch",prepMin:25,
      macros:{kcal:390,carbs:9,protein:18,fat:30},
      ingredients:["400g Champignons","200ml Sahne","100g Frischkäse","1 Zwiebel","Thymian","Butter"],
      steps:"Zwiebel & Pilze in Butter anschwitzen. Sahne & Frischkäse einrühren, köcheln. Pürieren.",
      tags:["batch","comfort"],batchDays:3},
    {id:"r9",name:"Auberginen-Parmesan",type:"dinner",prepMin:35,
      macros:{kcal:520,carbs:13,protein:26,fat:38},
      ingredients:["2 Auberginen","150g Mozzarella","100g Parmesan","400g Tomaten","Basilikum","Olivenöl"],
      steps:"Auberginen scheibeln, salzen. Schichten: Aubergine – Tomate – Käse. 25 Min bei 180°C.",
      tags:["batch","klassiker"],batchDays:2},
    {id:"r10",name:"Keto-Käsespätzle (Blumenkohl)",type:"dinner",prepMin:30,
      macros:{kcal:560,carbs:11,protein:30,fat:42},
      ingredients:["1 Blumenkohl","200g Bergkäse","100ml Sahne","2 Zwiebeln","Butter","Muskat"],
      steps:"Blumenkohl als Ersatz für Spätzle vorbereiten. Mit Käsesahnesoße überziehen, mit Röstzwiebeln servieren.",
      tags:["comfort","batch"],batchDays:2},
    {id:"r11",name:"Griechischer Salat mit Tempeh",type:"dinner",prepMin:15,
      macros:{kcal:430,carbs:12,protein:24,fat:32},
      ingredients:["200g Tempeh","1 Gurke","2 Tomaten","100g Feta","Oliven","Oregano","Olivenöl"],
      steps:"Tempeh anbraten. Gemüse würfeln, Feta dazu, Oregano, Olivenöl – Tempeh obendrauf.",
      tags:["schnell","protein"],batchDays:1},
    {id:"r12",name:"Shakshuka (Keto)",type:"dinner",prepMin:25,
      macros:{kcal:370,carbs:11,protein:20,fat:26},
      ingredients:["4 Eier","400g Tomaten","1 Paprika","Cumin","Paprika","Feta","Petersilie"],
      steps:"Tomaten & Paprika köcheln. Mulden eindrücken, Eier reingeben, stocken lassen. Mit Feta & Petersilie.",
      tags:["schnell","comfort"],batchDays:1},
    {id:"r13",name:"Avocado-Rösti mit Ei",type:"breakfast",prepMin:10,
      macros:{kcal:400,carbs:7,protein:16,fat:34},
      ingredients:["2 Eier","1 Avocado","30g Mandelmehl","Salz","Olivenöl"],
      steps:"Avocado zerdrücken, mit Mandelmehl & Ei mischen, kleine Rösti formen, braten.",
      tags:["schnell","Ω3"],batchDays:1},
    {id:"r14",name:"Brokkoli-Käse-Auflauf",type:"lunch",prepMin:35,
      macros:{kcal:490,carbs:11,protein:28,fat:36},
      ingredients:["500g Brokkoli","200ml Sahne","150g Gouda","2 Eier","Muskat","Butter"],
      steps:"Brokkoli blanchieren. Sahne-Ei-Käse-Mix darüber, 25 Min bei 180°C backen.",
      tags:["batch"],batchDays:3},
    {id:"r15",name:"Pak-Choi-Tofu-Pfanne",type:"dinner",prepMin:20,
      macros:{kcal:380,carbs:10,protein:24,fat:26},
      ingredients:["300g Tofu","2 Pak Choi","2 EL Tamari","Ingwer","Knoblauch","Sesamöl"],
      steps:"Tofu scharf anbraten. Pak Choi dazu. Mit Tamari, Ingwer, Knoblauch würzen. Sesamöl am Ende.",
      tags:["vegan","asiatisch"],batchDays:1},
    {id:"r16",name:"Frischkäse-Wraps (Salat)",type:"lunch",prepMin:10,
      macros:{kcal:350,carbs:8,protein:18,fat:26},
      ingredients:["4 Salatblätter","100g Frischkäse","60g Räucherlachs (veg: Feta)","Gurke","Dill"],
      steps:"Salatblätter als Wrap nutzen, mit Frischkäse bestreichen, Füllung einrollen.",
      tags:["schnell","prep"],batchDays:1},
    {id:"r17",name:"Spinat-Ricotta-Bällchen",type:"dinner",prepMin:30,
      macros:{kcal:440,carbs:9,protein:24,fat:33},
      ingredients:["250g Ricotta","200g Spinat","2 Eier","50g Parmesan","Muskat","Olivenöl"],
      steps:"Spinat auspressen, mit Ricotta, Ei, Parmesan mischen, Bällchen formen, backen.",
      tags:["batch","protein"],batchDays:2},
    {id:"r18",name:"Kokos-Blumenkohl-Curry",type:"dinner",prepMin:30,
      macros:{kcal:460,carbs:14,protein:14,fat:36},
      ingredients:["1 Blumenkohl","400ml Kokosmilch","2 EL Currypaste","Limette","Koriander","Ingwer"],
      steps:"Blumenkohl in Currypaste anrösten, Kokosmilch dazu, 15 Min köcheln. Mit Limette & Koriander.",
      tags:["vegan","batch"],batchDays:3},
  ];

  // Build 6-week plan
  function buildWeekPlan(){
    const plan={};
    const startDate=new Date(2025,0,6); // 6 Jan 2025 (Mon)
    const bfRecipes=RECIPES.filter(r=>r.type==="breakfast");
    const lunchRecipes=RECIPES.filter(r=>r.type==="lunch");
    const dinnerRecipes=RECIPES.filter(r=>r.type==="dinner");

    for(let week=0;week<6;week++){
      for(let day=0;day<7;day++){
        const d=new Date(startDate);
        d.setDate(d.getDate()+week*7+day);
        const key=d.toISOString().slice(0,10);
        plan[key]={
          breakfast:bfRecipes[(week*7+day)%bfRecipes.length],
          lunch:lunchRecipes[(week*7+day+1)%lunchRecipes.length],
          dinner:dinnerRecipes[(week*7+day+2)%dinnerRecipes.length],
          eatenA:{breakfast:false,lunch:false,dinner:false},
          eatenB:{breakfast:false,lunch:false,dinner:false},
        };
      }
    }
    return plan;
  }

  // ─── HELPERS ─────────────────────────────────────────────────────────────
  function fmt(v){return typeof v==="number"?Math.round(v):v}
  function dateKey(d){return d.toISOString().slice(0,10)}
  function getMonday(d){const day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1);return new Date(d.setDate(diff))}
  const DAYS=["Mo","Di","Mi","Do","Fr","Sa","So"];
  const MONTHS=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
  function weekDates(monday){return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d})}

  function ProgressBar({value,max,color="#3d6b58",label,unit="g"}){
    const pct=Math.min(100,(value/max)*100);
    return(
      <div className="macro-row">
        <span className="macro-label">{label}</span>
        <div className="progress-bar" style={{flex:1}}>
          <div className="progress-fill" style={{width:pct+"%",background:color}}/>
        </div>
        <span className="macro-value">{fmt(value)}/{max}{unit}</span>
      </div>
    );
  }

  function Snackbar({msg,onClose}){
    useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t)},[]);
    return <div className="snack">{msg}</div>;
  }

  // ─── MAIN APP ────────────────────────────────────────────────────────────
  function App(){
    const [tab,setTab]=useState("dashboard");
    const [plan,setPlan]=useState(()=>{
      const saved=localStorage.getItem("vk_plan");
      return saved?JSON.parse(saved):buildWeekPlan();
    });
    const [customRecipes,setCustomRecipes]=useState(()=>JSON.parse(localStorage.getItem("vk_custom")||"[]"));
    const [electrolytes,setElectrolytes]=useState(()=>JSON.parse(localStorage.getItem("vk_electro")||"{}"));
    const [batchMode,setBatchMode]=useState(false);
    const [currentWeek,setCurrentWeek]=useState(()=>getMonday(new Date()));
    const [snack,setSnack]=useState(null);
    const [modal,setModal]=useState(null);
    const [shoppingWeek,setShoppingWeek]=useState(()=>getMonday(new Date()));

    useEffect(()=>{localStorage.setItem("vk_plan",JSON.stringify(plan))},[plan]);
    useEffect(()=>{localStorage.setItem("vk_custom",JSON.stringify(customRecipes))},[customRecipes]);
    useEffect(()=>{localStorage.setItem("vk_electro",JSON.stringify(electrolytes))},[electrolytes]);

    const toast=(msg)=>setSnack(msg);

    const allRecipes=[...RECIPES,...customRecipes];
    const macroA=calcMacros(PERSONS.A);
    const macroB=calcMacros(PERSONS.B);

    // Compute daily totals from eaten meals
    function getDailyMacros(person,dateK){
      const day=plan[dateK];
      if(!day)return{kcal:0,carbs:0,protein:0,fat:0};
      const eaten=person==="A"?day.eatenA:day.eatenB;
      let tot={kcal:0,carbs:0,protein:0,fat:0};
      ["breakfast","lunch","dinner"].forEach(m=>{
        if(eaten[m]&&day[m]){Object.keys(tot).forEach(k=>tot[k]+=day[m].macros[k]||0)}
      });
      return tot;
    }

    function toggleEaten(dateK,meal,person){
      setPlan(p=>{
        const prev={...p};
        const day={...prev[dateK]};
        const key=person==="A"?"eatenA":"eatenB";
        day[key]={...day[key],[meal]:!day[key][meal]};
        prev[dateK]=day;
        return prev;
      });
    }

    const todayKey=dateKey(new Date());
    const todayA=getDailyMacros("A",todayKey);
    const todayB=getDailyMacros("B",todayKey);

    // Leftover analysis
    const leftovers=useMemo(()=>{
      const counts={};
      const weekD=weekDates(currentWeek);
      weekD.forEach(d=>{
        const day=plan[dateKey(d)];
        if(!day)return;
        ["breakfast","lunch","dinner"].forEach(m=>{
          if(day[m]){
            day[m].ingredients.forEach(ing=>{
              const base=ing.replace(/^\d+[\w\s]*\s/,"").toLowerCase();
              counts[base]=(counts[base]||0)+1;
              if(ing.toLowerCase().includes("½")||ing.toLowerCase().includes("halb")){
                counts[base]=(counts[base]||0)-0.5;
              }
            });
          }
        });
      });
      return Object.entries(counts).filter(([,n])=>n<1.5).map(([k])=>k).slice(0,4);
    },[plan,currentWeek]);

    // Shopping list from current week
    const shoppingList=useMemo(()=>{
      const items={};
      const weekD=weekDates(shoppingWeek);
      weekD.forEach(d=>{
        const day=plan[dateKey(d)];
        if(!day)return;
        ["breakfast","lunch","dinner"].forEach(m=>{
          if(day[m]){
            day[m].ingredients.forEach(ing=>{
              const norm=ing.trim().toLowerCase();
              items[norm]=(items[norm]||0)+1;
            });
          }
        });
      });
      return Object.entries(items).sort((a,b)=>a[0].localeCompare(b[0]));
    },[plan,shoppingWeek]);

    function applyBatch(dateK,meal,recipe){
      setPlan(p=>{
        const np={...p};
        const days=Object.keys(np).sort();
        const idx=days.indexOf(dateK);
        for(let i=0;i<(recipe.batchDays||1)&&idx+i<days.length;i++){
          const d={...np[days[idx+i]]};
          d[meal]=recipe;
          np[days[idx+i]]=d;
        }
        return np;
      });
      toast(`📦 ${recipe.name} für ${recipe.batchDays||1} Tage eingeplant!`);
    }

    return(
      <div>
        <header className="app-header">
          <h1><span className="logo-dot"/>&nbsp;VegeKeto</h1>
          <nav>
            {[["dashboard","Dashboard"],["calendar","Kalender"],["shopping","Einkauf"],["health","Gesundheit"],["recipes","Rezepte"]].map(([k,l])=>(
              <button key={k} className={tab===k?"active":""} onClick={()=>setTab(k)}>
                <span>{l}</span>
              </button>
            ))}
          </nav>
        </header>

        <div className="main">
          {tab==="dashboard"&&<Dashboard macroA={macroA} macroB={macroB} todayA={todayA} todayB={todayB} plan={plan} todayKey={todayKey} toggleEaten={toggleEaten} electrolytes={electrolytes} setElectrolytes={setElectrolytes} toast={toast}/>}
          {tab==="calendar"&&<CalendarView plan={plan} setPlan={setPlan} currentWeek={currentWeek} setCurrentWeek={setCurrentWeek} toggleEaten={toggleEaten} batchMode={batchMode} setBatchMode={setBatchMode} applyBatch={applyBatch} allRecipes={allRecipes} leftovers={leftovers} toast={toast} setModal={setModal}/>}
          {tab==="shopping"&&<ShoppingView shoppingList={shoppingList} shoppingWeek={shoppingWeek} setShoppingWeek={setShoppingWeek} leftovers={leftovers}/>}
          {tab==="health"&&<HealthView electrolytes={electrolytes} setElectrolytes={setElectrolytes} toast={toast}/>}
          {tab==="recipes"&&<RecipesView customRecipes={customRecipes} setCustomRecipes={setCustomRecipes} allRecipes={allRecipes} toast={toast}/>}
        </div>

        {modal&&<ModalView modal={modal} onClose={()=>setModal(null)} allRecipes={allRecipes} plan={plan} setPlan={setPlan} batchMode={batchMode} applyBatch={applyBatch} toast={toast}/>}
        {snack&&<Snackbar msg={snack} onClose={()=>setSnack(null)}/>}
      </div>
    );
  }

  // ─── CALENDAR ────────────────────────────────────────────────────────────
  function CalendarView({plan,setPlan,currentWeek,setCurrentWeek,toggleEaten,batchMode,setBatchMode,applyBatch,allRecipes,leftovers,toast,setModal}){
    const days=weekDates(currentWeek);
    const [dragOver,setDragOver]=useState(null);
    const dragRef=useRef(null);

    function prevWeek(){const d=new Date(currentWeek);d.setDate(d.getDate()-7);setCurrentWeek(d)}
    function nextWeek(){const d=new Date(currentWeek);d.setDate(d.getDate()+7);setCurrentWeek(d)}

    function onDragStart(dateK,meal,recipe){
      dragRef.current={dateK,meal,recipe};
    }
    function onDrop(targetDateK,targetMeal){
      if(!dragRef.current)return;
      const {dateK,meal,recipe}=dragRef.current;
      if(dateK===targetDateK&&meal===targetMeal)return;
      setPlan(p=>{
        const np={...p};
        const src={...np[dateK]};
        const tgt={...np[targetDateK]};
        const tmp=src[meal];
        src[meal]=tgt[targetMeal];
        tgt[targetMeal]=tmp;
        np[dateK]=src;
        np[targetDateK]=tgt;
        return np;
      });
      toast("🔄 Mahlzeit getauscht!");
      dragRef.current=null;
      setDragOver(null);
    }

    const weekLabel=`KW ${getISOWeek(currentWeek)} · ${currentWeek.getDate()}. ${MONTHS[currentWeek.getMonth()]}`;

    return(
      <div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"1rem"}}>
          <div className="week-nav">
            <button onClick={prevWeek}>‹</button>
            <span>{weekLabel}</span>
            <button onClick={nextWeek}>›</button>
          </div>
          <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
            <label style={{display:"flex",alignItems:"center",gap:"6px",cursor:"pointer",fontSize:"0.82rem",fontWeight:500,marginBottom:0}}>
              <input type="checkbox" checked={batchMode} onChange={e=>setBatchMode(e.target.checked)} style={{width:"auto",accentColor:"var(--green)"}}/>
              Batch-Cooking
            </label>
            <span className={`badge ${batchMode?"badge-green":"badge-amber"}`}>{batchMode?"📦 Aktiv":"Aus"}</span>
          </div>
        </div>

        {leftovers.length>0&&(
          <div className="leftover-card">
            <div style={{fontWeight:500,fontSize:"0.85rem",marginBottom:"4px"}}>♻️ Resteverwerter</div>
            <div style={{fontSize:"0.8rem",color:"var(--text2)"}}>Diese Zutaten tauchen nur einmal auf – plan sie in die nächste Mahlzeit ein:</div>
            <div style={{marginTop:"6px",display:"flex",gap:"4px",flexWrap:"wrap"}}>
              {leftovers.map(l=><span key={l} className="tag">{l}</span>)}
            </div>
          </div>
        )}

        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"6px"}}>
          {days.map(d=>{
            const dk=dateKey(d);
            const day=plan[dk];
            const isToday=dk===dateKey(new Date());
            return(
              <div key={dk} className="day-col" style={{border:isToday?"2px solid var(--green)":"1px solid var(--cream3)"}}>
                <div className="day-header" style={{background:isToday?"var(--green)":"var(--green-dark)"}}>
                  {DAYS[d.getDay()===0?6:d.getDay()-1]} {d.getDate()}.
                </div>
                <div style={{padding:"4px",display:"flex",flexDirection:"column",gap:"4px"}}>
                  {day&&["breakfast","lunch","dinner"].map(m=>{
                    const recipe=day[m];
                    const eA=day.eatenA[m];const eB=day.eatenB[m];
                    const mIcon={breakfast:"🌅",lunch:"☀️",dinner:"🌙"}[m];
                    return(
                      <div key={m}
                           className={`meal-card ${(eA&&eB)?"eaten":""}`}
                           draggable
                           onDragStart={()=>onDragStart(dk,m,recipe)}
                           onDragOver={e=>{e.preventDefault();setDragOver(dk+m)}}
                           onDragLeave={()=>setDragOver(null)}
                           onDrop={()=>onDrop(dk,m)}
                           style={{borderColor:dragOver===dk+m?"var(--green-light)":undefined,padding:"6px"}}
                           onClick={()=>setModal({type:"meal",dateK:dk,meal:m,recipe,day})}
                      >
                        <div style={{fontSize:"0.65rem",color:"var(--text3)"}}>{mIcon} {recipe?.name||"-"}</div>
                        {recipe&&<div style={{display:"flex",gap:"3px",marginTop:"3px"}}>
                          <span style={{fontSize:"0.6rem",color:"#065f46",background:"#d1fae5",borderRadius:"4px",padding:"1px 4px"}}>{recipe.macros.carbs}c</span>
                          <span style={{fontSize:"0.6rem",color:"#92400e",background:"#fef3c7",borderRadius:"4px",padding:"1px 4px"}}>{recipe.macros.fat}f</span>
                        </div>}
                        <div style={{display:"flex",gap:"3px",marginTop:"4px"}}>
                          {[["A","#3d6b58"],["B","#c8853a"]].map(([p,c])=>(
                            <div key={p} onClick={e=>{e.stopPropagation();toggleEaten(dk,m,p)}}
                                 className={`check-box ${day[`eaten${p}`][m]?"checked":""}`}
                                 style={{width:14,height:14,borderRadius:4,borderColor:c,background:day[`eaten${p}`][m]?c:"white"}}
                            />
                          ))}
                        </div>
                        {batchMode&&recipe&&<button className="btn btn-sm" style={{marginTop:"4px",width:"100%",fontSize:"0.6rem",padding:"2px 4px",background:"#fffbf0",border:"1px solid var(--amber)",color:"var(--amber)"}}
                                                    onClick={e=>{e.stopPropagation();applyBatch(dk,m,recipe)}}>📦 Batch</button>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  function getISOWeek(d){
    const date=new Date(d);
    date.setHours(0,0,0,0);
    date.setDate(date.getDate()+3-(date.getDay()+6)%7);
    const week1=new Date(date.getFullYear(),0,4);
    return 1+Math.round(((date-week1)/86400000-3+(week1.getDay()+6)%7)/7);
  }

  // ─── MODAL (Meal Detail) ──────────────────────────────────────────────────

    function swap(newRecipe){
      setPlan(p=>{const np={...p};const d={...np[dateK]};d[meal]=newRecipe;np[dateK]=d;return np;});
      toast(`✏️ Ersetzt durch: ${newRecipe.name}`);
      onClose();

    const sameType=allRecipes.filter(r=>r.type===meal&&r.id!==recipe?.id);

    return(
      <div className="modal-overlay" onClick={onClose}>

                <span className="recipe-macro rm-prot">{recipe.macros.protein}g Protein</span>
                <span className="recipe-macro rm-fat">{recipe.macros.fat}g Fett</span>
                <span className="recipe-macro rm-cal">{recipe.macros.kcal} kcal</span>
                {recipe.prepMin&&<span className="badge badge-blue">⏱ {recipe.prepMin} Min</span>}
              </div>

              <div className="form-group">
                <label>Zutaten</label>
                <ul style={{paddingLeft:"1.2rem",fontSize:"0.85rem",color:"var(--text2)"}}>
                  {recipe.ingredients.map((i,n)=><li key={n} style={{marginBottom:"2px"}}>{i}</li>)}
                </ul>
              </div>

              {recipe.steps&&(
                <div className="form-group">
                  <label>Zubereitung</label>
                  <p style={{fontSize:"0.85rem",color:"var(--text2)",lineHeight:1.6}}>{recipe.steps}</p>
                </div>
              )}

              {batchMode&&<button className="btn btn-amber" style={{width:"100%",marginBottom:"8px"}} onClick={()=>{applyBatch(dateK,meal,recipe);onClose()}}>📦 Als Batch-Cooking einplanen ({recipe.batchDays} Tage)</button>}
            </>
          )}

          <div style={{borderTop:"1px solid var(--cream2)",paddingTop:"1rem",marginTop:"0.5rem"}}>
            <button className="btn btn-secondary" style={{width:"100%"}} onClick={()=>setSwapOpen(!swapOpen)}>
              🔄 Mahlzeit ersetzen {swapOpen?"▲":"▼"}
            </button>
            {swapOpen&&(
              <div style={{marginTop:"8px",maxHeight:"250px",overflowY:"auto"}}>
                {sameType.map(r=>(
                  <div key={r.id} onClick={()=>swap(r)} style={{padding:"8px",borderRadius:"8px",cursor:"pointer",border:"1px solid var(--cream3)",marginBottom:"4px",background:"white"}} className="meal-card">
                    <div style={{fontWeight:500,fontSize:"0.85rem"}}>{r.name}</div>
                    <div style={{display:"flex",gap:"4px",marginTop:"4px"}}>
                      <span className="recipe-macro rm-carb">{r.macros.carbs}g C</span>
                      <span className="recipe-macro rm-prot">{r.macros.protein}g P</span>
                      <span className="recipe-macro rm-fat">{r.macros.fat}g F</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ─── SHOPPING ────────────────────────────────────────────────────────────
  function ShoppingView({shoppingList,shoppingWeek,setShoppingWeek,leftovers}){
    const [checked,setChecked]=useState({});
    const [search,setSearch]=useState("");

    function prevW(){const d=new Date(shoppingWeek);d.setDate(d.getDate()-7);setShoppingWeek(d)}
    function nextW(){const d=new Date(shoppingWeek);d.setDate(d.getDate()+7);setShoppingWeek(d)}

    const filtered=shoppingList.filter(([k])=>k.includes(search.toLowerCase()));
    const categories={Gemüse:[],Eiweiß:[],Milch:[],Fette:[],Gewürze:[],Sonstiges:[]};

    const catMap={
      Gemüse:["blumenkohl","zucchini","brokkoli","spinat","paprika","auberginen","pilz","champignon","tomaten","pak choi","rucola","gurke"],
      Eiweiß:["eier","tofu","tempeh","halloumi","mozzarella","parmesan","feta","ricotta","käse"],
      Milch:["sahne","frischkäse","milch","butter","joghurt","kokosmilch"],
      Fette:["avocado","olivenöl","sesamöl","tahini","walnüsse","kokosraspeln","chiasamen","mandelmehl"],
      Gewürze:["salz","pfeffer","cumin","paprika","oregano","thymian","koriander","ingwer","knoblauch","rosmarin","basilikum","muskat","zimt","currypaste","tamari","zitrone","limette"]
    };

    filtered.forEach(([k,n])=>{
      let found=false;
      for(const[cat,words]of Object.entries(catMap)){
        if(words.some(w=>k.includes(w))){categories[cat].push([k,n]);found=true;break}
      }
      if(!found)categories.Sonstiges.push([k,n]);
    });

    const total=filtered.length;
    const done=Object.values(checked).filter(Boolean).length;

    return(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
          <h2 style={{fontWeight:400}}>🛒 Einkaufsliste</h2>
          <div style={{display:"flex",gap:"6px"}}>
            <button className="btn btn-secondary btn-sm" onClick={prevW}>‹</button>
            <span style={{fontSize:"0.82rem",padding:"0 8px",display:"flex",alignItems:"center"}}>KW {getISOWeek(shoppingWeek)}</span>
            <button className="btn btn-secondary btn-sm" onClick={nextW}>›</button>
          </div>
        </div>

        <div style={{display:"flex",gap:"8px",marginBottom:"1rem",alignItems:"center"}}>
          <input placeholder="Suche Zutat..." value={search} onChange={e=>setSearch(e.target.value)} style={{maxWidth:260}}/>
          <span className="badge badge-green">{done}/{total} erledigt</span>
          <button className="btn btn-secondary btn-sm" onClick={()=>setChecked({})}>Reset</button>
        </div>

        {leftovers.length>0&&(
          <div className="leftover-card" style={{marginBottom:"1rem"}}>
            <div style={{fontWeight:500,fontSize:"0.85rem"}}>♻️ Diese Reste aus der Vorwoche nutzen:</div>
            <div style={{display:"flex",gap:"4px",flexWrap:"wrap",marginTop:"4px"}}>
              {leftovers.map(l=><span key={l} className="tag">✓ {l}</span>)}
            </div>
          </div>
        )}

        <div className="grid-2">
          {Object.entries(categories).filter(([,items])=>items.length>0).map(([cat,items])=>(
            <div key={cat} className="card">
              <div style={{fontWeight:600,fontSize:"0.82rem",color:"var(--text3)",marginBottom:"8px",textTransform:"uppercase",letterSpacing:"0.06em"}}>{cat}</div>
              {items.map(([k,n])=>(
                <div key={k} className="shopping-item" style={{opacity:checked[k]?0.4:1}}>
                  <div className={`check-box ${checked[k]?"checked":""}`} onClick={()=>setChecked(c=>({...c,[k]:!c[k]}))}/>
                  <span style={{flex:1,fontSize:"0.85rem",textDecoration:checked[k]?"line-through":"none"}}>{k}</span>
                  {n>1&&<span className="badge badge-blue" style={{fontSize:"0.7rem"}}>×{n}</span>}
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ─── HEALTH ──────────────────────────────────────────────────────────────
  function HealthView({electrolytes,setElectrolytes,toast}){
    const today=new Date();
    const dk=dateKey(today);

    const supps=[
      {key:"b12",name:"Vitamin B12",icon:"💊",critical:true,detail:"Kritisch bei vegetarischer Ernährung. 500–1000 µg täglich oder 2000 µg wöchentlich. Methylcobalamin bevorzugen.",color:"#fee2e2"},
      {key:"d3",name:"Vitamin D3 + K2",icon:"☀️",critical:true,detail:"D3 1000–4000 IE täglich + K2 100 µg. Wichtig für Knochenstoffwechsel und Immunsystem.",color:"#fef3c7"},
      {key:"omega3",name:"Omega-3 (EPA/DHA)",icon:"🐟",critical:true,detail:"Algenöl-basiertes Omega-3 (Vegan-freundlich). 250–500 mg EPA+DHA täglich für Gehirn & Herz.",color:"#dbeafe"},
      {key:"iron",name:"Eisen",icon:"⚡",critical:false,detail:"Nicht-Häm-Eisen schlechter bioverfügbar. Mit Vitamin C zusammen einnehmen. Blutwerte checken.",color:"#ede9fe"},
      {key:"zinc",name:"Zink",icon:"🛡",critical:false,detail:"10–15 mg täglich. Wichtig für Immunsystem & Hormone. Getrennt von Kaffee/Tee einnehmen.",color:"#d1fae5"},
      {key:"mag",name:"Magnesium",icon:"🔋",critical:false,detail:"300–400 mg täglich. Besonders bei Keto wichtig (vermehrt ausgeschieden). Glycinat gut verträglich.",color:"#fce7f3"},
    ];

    const weekTracking=Array.from({length:7},(_,i)=>{
      const d=new Date(today);d.setDate(d.getDate()-6+i);
      const k=dateKey(d);
      const mg=electrolytes[k+"_mg"]||false;
      const pot=electrolytes[k+"_k"]||false;
      const salt=electrolytes[k+"_salt"]||false;
      return{date:d,k,mg,pot,salt,label:DAYS[d.getDay()===0?6:d.getDay()-1]};
    });

    return(
      <div>
        <h2 style={{marginBottom:"1.5rem",fontWeight:400}}>🩺 Gesundheits-Guide</h2>

        {/* Warning System */}
        <div className="card">
          <h3 style={{marginBottom:"1rem",fontWeight:400}}>⚠️ Kritische Nährstoffe – Vegetarisch-Keto</h3>
          {supps.map(s=>(
            <div key={s.key} style={{borderLeft:`4px solid ${s.critical?"#ef4444":"#f59e0b"}`,background:s.color,borderRadius:"0 var(--radius) var(--radius) 0",padding:"0.8rem",marginBottom:"0.5rem"}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px"}}>
                <span style={{fontSize:"1rem"}}>{s.icon}</span>
                <span style={{fontWeight:600,fontSize:"0.88rem"}}>{s.name}</span>
                {s.critical&&<span className="badge badge-red">Kritisch</span>}
              </div>
              <p style={{fontSize:"0.8rem",color:"var(--text2)",lineHeight:1.5}}>{s.detail}</p>
            </div>
          ))}
        </div>

        {/* Keto-Grippe Prävention */}
        <div className="card">
          <h3 style={{marginBottom:"0.5rem",fontWeight:400}}>💧 Elektrolyt-Wochenübersicht</h3>
          <p style={{fontSize:"0.8rem",color:"var(--text3)",marginBottom:"1rem"}}>Keto-Grippe entsteht durch Elektrolytmangel – check täglich!</p>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:"0.82rem"}}>
              <thead>
              <tr>
                <th style={{textAlign:"left",padding:"6px",fontWeight:500,color:"var(--text3)"}}>Tag</th>
                {weekTracking.map(w=><th key={w.k} style={{padding:"6px",textAlign:"center",fontWeight:500,color:w.k===dk?"var(--green)":"var(--text3)"}}>{w.label}</th>)}
              </tr>
              </thead>
              <tbody>
              {[["🔋 Mg","mg"],["🍌 K","k"],["🧂 Na","salt"]].map(([label,key])=>(
                <tr key={key}>
                  <td style={{padding:"6px",fontWeight:500}}>{label}</td>
                  {weekTracking.map(w=>(
                    <td key={w.k} style={{padding:"6px",textAlign:"center"}}>
                      <div className={`check-box ${w[key]?"checked":""}`} style={{margin:"0 auto",cursor:w.k===dk?"pointer":"default"}}
                           onClick={()=>{
                             if(w.k!==dk)return;
                             setElectrolytes(e=>({...e,[w.k+"_"+key]:!e[w.k+"_"+key]}));
                           }}/>
                    </td>
                  ))}
                </tr>
              ))}
              </tbody>
            </table>
          </div>
        </div>

        {/* Keto-Info */}
        <div className="card" style={{background:"var(--cream2)"}}>
          <h3 style={{marginBottom:"1rem",fontWeight:400}}>📊 Ketose-Grundlagen</h3>
          <div className="grid-2">
            {[
              {t:"Net-Carbs Limit",v:"20–30g täglich",desc:"Bruttocarbs minus Ballaststoffe = Net Carbs"},
              {t:"Proteinzufuhr",v:"1,4g/kg KG",desc:"Moderat – zu viel kann Ketose hemmen (Gluconeogenese)"},
              {t:"Fett als Hauptenergie",v:"~65–75%",desc:"Bevorzuge MCT-Öl, Kokosöl, Avocado, Olivenöl"},
              {t:"Ketose-Einlaufzeit",v:"2–7 Tage",desc:"In dieser Phase können Keto-Grippe-Symptome auftreten"},
            ].map(i=>(
              <div key={i.t} style={{background:"white",borderRadius:"12px",padding:"0.8rem"}}>
                <div style={{fontSize:"0.72rem",color:"var(--text3)"}}>{i.t}</div>
                <div style={{fontWeight:600,color:"var(--green)",fontSize:"1rem",margin:"2px 0"}}>{i.v}</div>
                <div style={{fontSize:"0.75rem",color:"var(--text2)"}}>{i.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ─── RECIPES ─────────────────────────────────────────────────────────────
  function RecipesView({customRecipes,setCustomRecipes,allRecipes,toast}){
    const [showForm,setShowForm]=useState(false);
    const [filter,setFilter]=useState("all");
    const [form,setForm]=useState({name:"",type:"breakfast",prepMin:15,kcal:"",carbs:"",protein:"",fat:"",ingredients:"",steps:""});

    function addRecipe(){
      if(!form.name||!form.kcal){toast("⚠️ Name & Kalorien erforderlich");return}
      const nr={
        id:"c"+Date.now(),name:form.name,type:form.type,prepMin:parseInt(form.prepMin)||15,
        macros:{kcal:parseInt(form.kcal)||0,carbs:parseInt(form.carbs)||0,protein:parseInt(form.protein)||0,fat:parseInt(form.fat)||0},
        ingredients:form.ingredients.split("\n").filter(Boolean),
        steps:form.steps,tags:["eigenes"],batchDays:1,custom:true
      };
      setCustomRecipes(r=>[...r,nr]);
      toast("✅ Rezept gespeichert!");
      setShowForm(false);
      setForm({name:"",type:"breakfast",prepMin:15,kcal:"",carbs:"",protein:"",fat:"",ingredients:"",steps:""});
    }

    function deleteRecipe(id){
      setCustomRecipes(r=>r.filter(x=>x.id!==id));
      toast("🗑 Rezept gelöscht");
    }

    const filtered=allRecipes.filter(r=>filter==="all"||r.type===filter);

    return(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}>
          <h2 style={{fontWeight:400}}>📖 Rezept-Bibliothek</h2>
          <button className="btn btn-primary" onClick={()=>setShowForm(!showForm)}>+ Eigenes Rezept</button>
        </div>

        {showForm&&(
          <div className="card" style={{border:"2px solid var(--green-light)",marginBottom:"1rem"}}>
            <h3 style={{marginBottom:"1rem",fontWeight:400}}>Neues Rezept</h3>
            <div className="grid-2">
              <div className="form-group"><label>Name *</label><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="z.B. Avocado-Bowl"/></div>
              <div className="form-group"><label>Typ</label>
                <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
                  <option value="breakfast">Frühstück</option><option value="lunch">Mittagessen</option><option value="dinner">Abendessen</option>
                </select>
              </div>
            </div>
            <div className="grid-3" style={{gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr"}}>
              {[["Kalorien *","kcal","kcal"],["Carbs (g)","carbs","g"],["Protein (g)","protein","g"],["Fett (g)","fat","g"],["Zubereitung","prepMin","min"]].map(([l,k,u])=>(
                <div key={k} className="form-group"><label>{l}</label><input type="number" value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} placeholder={u}/></div>
              ))}
            </div>
            <div className="form-group"><label>Zutaten (eine pro Zeile)</label><textarea rows={4} value={form.ingredients} onChange={e=>setForm(f=>({...f,ingredients:e.target.value}))} placeholder="1 Avocado&#10;2 Eier&#10;30g Feta"/></div>
            <div className="form-group"><label>Zubereitung</label><textarea rows={3} value={form.steps} onChange={e=>setForm(f=>({...f,steps:e.target.value}))} placeholder="Beschreibe die Zubereitung..."/></div>
            <div style={{display:"flex",gap:"8px"}}>
              <button className="btn btn-primary" onClick={addRecipe}>Speichern</button>
              <button className="btn btn-secondary" onClick={()=>setShowForm(false)}>Abbrechen</button>
            </div>
          </div>
        )}

        <div className="tabs">
          {[["all","Alle"],["breakfast","Frühstück"],["lunch","Mittag"],["dinner","Abendessen"]].map(([k,l])=>(
            <button key={k} className={`tab ${filter===k?"active":""}`} onClick={()=>setFilter(k)}>{l}</button>
          ))}
        </div>

        <div className="grid-3">
          {filtered.map(r=>(
            <div key={r.id} className="card" style={{position:"relative"}}>
              {r.custom&&<span className="badge badge-amber" style={{position:"absolute",top:"12px",right:"12px"}}>Eigenes</span>}
              <div style={{fontWeight:500,fontSize:"0.9rem",marginBottom:"4px",paddingRight:"60px"}}>{r.name}</div>
              <div style={{display:"flex",gap:"3px",flexWrap:"wrap",marginBottom:"8px"}}>
                {r.tags?.map(t=><span key={t} className="tag">{t}</span>)}
              </div>
              <div style={{display:"flex",gap:"4px",flexWrap:"wrap",marginBottom:"8px"}}>
                <span className="recipe-macro rm-carb">{r.macros.carbs}g C</span>
                <span className="recipe-macro rm-prot">{r.macros.protein}g P</span>
                <span className="recipe-macro rm-fat">{r.macros.fat}g F</span>
                <span className="recipe-macro rm-cal">{r.macros.kcal} kcal</span>
                {r.prepMin&&<span className="badge badge-blue">⏱ {r.prepMin}min</span>}
              </div>
              <div style={{fontSize:"0.78rem",color:"var(--text3)",marginBottom:"8px"}}>
                {r.ingredients?.slice(0,3).join(", ")}{r.ingredients?.length>3?` +${r.ingredients.length-3} mehr`:""}
              </div>
              {r.custom&&<button className="btn btn-danger btn-sm" onClick={()=>deleteRecipe(r.id)}>Löschen</button>}
            </div>
          ))}
        </div>
      </div>
    );
  }

  ReactDOM.render(<App/>,document.getElementById("root"));
</script>

<!-- PWA Manifest inline script -->
<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  // Create manifest dynamically
  const manifest={
    name:"VegeKeto – Ernährungsplan",short_name:"VegeKeto",
    start_url:".",display:"standalone",
    background_color:"#f5f0e8",theme_color:"#2d4a3e",
    icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='32' fill='%232d4a3e'/><text y='140' font-size='120' text-anchor='middle' x='96'>🥗</text></svg>",sizes:"192x192",type:"image/svg+xml"}]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/json"});
  const link=document.createElement("link");
  link.rel="manifest";link.href=URL.createObjectURL(blob);
  document.head.appendChild(link);
</script>
</body>
</html>
